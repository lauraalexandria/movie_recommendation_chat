  db_data:
  grafana_data: {}
  prometheus_data: {}
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge

services:

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant_service
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - rag-network

  # Estou testando os dockers separadamente (para rodar ele minha memória saiu de 40 GB para 23 GB - e se eu reiniciar?)
