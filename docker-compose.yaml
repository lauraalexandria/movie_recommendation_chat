  # colocar o app no docker-compose
  # no script da api não tem configuração dos modelos...
  # para testar: give me a animation recomendation that adults and children can enjoy it

  rag-api:
    build:
      context: .  # Contexto raiz do projeto
      dockerfile: api/Dockerfile  # Caminho para o Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env  # Arquivo com variáveis de ambiente
    volumes:
      - ./src:/app/src #rag-engine/src:/app
      - ./logs:/app/logs
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - rag-network
    restart: unless-stopped

